name: Build Theettam v2.4 with KSUN v3.4.2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source (v2.4 Tag)
        uses: actions/checkout@v4
        with:
          ref: 'v2.4'
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex libelf-dev libssl-dev libncurses-dev git-core zip clang

      - name: Setup Toolchain (Clang)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          curl -LO https://googlesource.com
          tar -xzf clang-r522817.tar.gz

      - name: Inject KernelSU-Next v3.4.2
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf drivers/kernelsu
          git clone --branch v3.4.2 --recursive https://github.com drivers/kernelsu

      - name: Compile Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          
          make O=out peridot_defconfig
          make -j$(nproc) O=out

      - name: Package into AnyKernel3 Zip
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com $GITHUB_WORKSPACE/AnyKernel3
          cp out/arch/arm64/boot/Image $GITHUB_WORKSPACE/AnyKernel3/
          cd $GITHUB_WORKSPACE/AnyKernel3
          zip -r9 ../Theettam-v2.4-KSUN-3.4.2.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Theettam-v2.4-Custom-Zip
          path: Theettam-v2.4-KSUN-3.4.2.zip
          
